name: Daily Embedded Systems Fresher Job Search

on:
  schedule:
    # 7:30 AM IST = 2:00 AM UTC
    # During DST (Mar-Oct): IST is UTC+5:30, so 7:30 AM IST = 2:00 AM UTC
    # During standard time (Oct-Mar): IST is UTC+5:30, so 7:30 AM IST = 2:00 AM UTC
    # Note: GitHub Actions runs on UTC, so we use 2:00 AM UTC which is approximately 7:30 AM IST
    - cron: '0 2 * * *'
  
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  search-jobs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic
      
      - name: Run job search script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/job_search.py
      
      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: job-search-results-${{ github.run_number }}
          path: job_results.md
          retention-days: 30
      
      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: 'Embedded Systems Fresher Jobs - ${{ github.run_id }}'
          to: ${{ secrets.ALERT_EMAIL }}
          from: ${{ secrets.EMAIL_USER }}
          body: |
            Daily Embedded Systems Job Search Results
            
            Job search completed at $(date).
            
            Results are attached below and saved in GitHub Actions artifacts.
            
            Search Parameters:
            - Region: India + International
            - Experience: 0 years (Freshers)
            - Salary Target: ₹1,00,000/month
            - Work Types: Onsite, Hybrid, Remote
            
            View full results in GitHub Actions:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: job_results.md
      
      - name: Create GitHub Issue with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toLocaleDateString('en-IN', {
              year: 'numeric',
              month: 'long',
              day: 'numeric',
              timeZone: 'Asia/Kolkata'
            });
            
            let body = `## Embedded Systems Fresher Jobs — ${date}\n\n`;
            
            if (fs.existsSync('job_results.md')) {
              const results = fs.readFileSync('job_results.md', 'utf8');
              body += results;
            } else {
              body += 'No job results file found. Check the workflow logs for details.';
            }
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Job Search Results — ${date}`,
              body: body,
              labels: ['job-search', 'embedded-systems']
            });

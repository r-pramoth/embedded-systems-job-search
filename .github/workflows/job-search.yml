name: Daily Embedded Systems Fresher Job Search

on:
  schedule:
    # 7:30 AM IST = 2:00 AM UTC
    - cron: '0 2 * * *'

  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  search-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run job search
        run: |
          python scripts/job_search.py

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-search-results-${{ github.run_number }}
          path: job_results.md
          retention-days: 30

      - name: Send email notification
        if: ${{ always() && secrets.EMAIL_USER != '' && secrets.EMAIL_PASSWORD != '' && secrets.ALERT_EMAIL != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: 'Embedded Systems Fresher Jobs - ${{ github.run_id }}'
          to: ${{ secrets.ALERT_EMAIL }}
          from: ${{ secrets.EMAIL_USER }}
          body: |
            Daily Embedded Systems Job Search Results

            Job search completed.

            Results are available in the GitHub Actions artifact and GitHub Issue.

            Search:
            - India + International
            - Embedded Systems
            - Freshers / Entry Level
            - Bengaluru priority
            - HARMAN, Samsung and other major companies
          attachments: job_results.md

      - name: Create GitHub Issue with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const date = new Date().toLocaleDateString('en-IN', {
              year: 'numeric',
              month: 'long',
              day: 'numeric',
              timeZone: 'Asia/Kolkata'
            });

            let body = `## Embedded Systems Fresher Jobs — ${date}\n\n`;

            if (fs.existsSync('job_results.md')) {
              const results = fs.readFileSync(
                'job_results.md',
                'utf8'
              );

              body += results;
            }
            else {
              body +=
                'No job results file found. Check the workflow logs for details.';
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Job Search Results — ${date}`,
              body: body
            });

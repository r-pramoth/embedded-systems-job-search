name: Daily Embedded Systems Fresher Job Search

on:
  schedule:
    # Daily search: 7:30 AM IST = 2:00 AM UTC
    - cron: '0 2 * * *'

    # Check Telegram for /start every 5 minutes
    - cron: '*/5 * * * *'

  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  search-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Telegram for /start
        id: telegram
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e

          echo "Checking Telegram for /start..."

          RESPONSE=$(curl -sS \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=-1&limit=1")

          echo "Telegram response received."

          UPDATE_ID=$(echo "$RESPONSE" | jq -r '.result[0].update_id // empty')
          MESSAGE_TEXT=$(echo "$RESPONSE" | jq -r '.result[0].message.text // empty')
          MESSAGE_CHAT_ID=$(echo "$RESPONSE" | jq -r '.result[0].message.chat.id // empty')

          echo "Latest update ID: ${UPDATE_ID:-none}"
          echo "Latest message: ${MESSAGE_TEXT:-none}"
          echo "Message chat ID: ${MESSAGE_CHAT_ID:-none}"

          if [ "$MESSAGE_TEXT" = "/start" ] && [ "$MESSAGE_CHAT_ID" = "$TELEGRAM_CHAT_ID" ]; then
            echo "start_requested=true" >> "$GITHUB_OUTPUT"
            echo "Authorized /start received."

            NEXT_OFFSET=$((UPDATE_ID + 1))

            curl -sS \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=${NEXT_OFFSET}&limit=1" \
              > /dev/null

            echo "Consumed /start update."
          else
            echo "start_requested=false" >> "$GITHUB_OUTPUT"
            echo "No new authorized /start request."
          fi

      - name: Determine whether to run job search
        id: run_search
        env:
          START_REQUESTED: ${{ steps.telegram.outputs.start_requested }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_search=true" >> "$GITHUB_OUTPUT"
            echo "Manual workflow execution detected."

          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 2 * * *" ]; then
            echo "run_search=true" >> "$GITHUB_OUTPUT"
            echo "Daily 7:30 AM IST search triggered."

          elif [ "$START_REQUESTED" = "true" ]; then
            echo "run_search=true" >> "$GITHUB_OUTPUT"
            echo "Telegram /start triggered the job search."

          else
            echo "run_search=false" >> "$GITHUB_OUTPUT"
            echo "No job search required."
          fi

      - name: Run job search
        if: steps.run_search.outputs.run_search == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/job_search.py

      - name: Upload results as artifact
        if: steps.run_search.outputs.run_search == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: job-search-results-${{ github.run_number }}
          path: job_results.md
          retention-days: 30

      - name: Create GitHub Issue with results
        if: steps.run_search.outputs.run_search == 'true' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const date = new Date().toLocaleDateString('en-IN', {
              year: 'numeric',
              month: 'long',
              day: 'numeric',
              timeZone: 'Asia/Kolkata'
            });

            let body = `## Embedded Systems Fresher Jobs — ${date}\n\n`;

            if (fs.existsSync('job_results.md')) {
              body += fs.readFileSync(
                'job_results.md',
                'utf8'
              );
            }
            else {
              body +=
                'No job results file found. Check the workflow logs for details.';
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Job Search Results — ${date}`,
              body: body
            });

            "At least five recent "
            "opportunities were discovered, "
            "so the 7-day fallback was not "
            "required."
        )

    report.append("")

    report.append(
        "## Important Verification Note"
    )

    report.append("")

    report.append(
        "This GitHub-only system uses "
        "automated keyword-based discovery "
        "rather than an AI web-search agent. "
        "Some job sites may block automated "
        "requests or may not expose their "
        "complete listings through public "
        "search. Always open the APPLY HERE "
        "link and verify the current job "
        "description, eligibility, location, "
        "salary, and application status."
    )

    return "\n".join(report)


def send_telegram_message(message):
    bot_token = os.environ.get(
        "TELEGRAM_BOT_TOKEN"
    )

    chat_id = os.environ.get(
        "TELEGRAM_CHAT_ID"
    )

    if not bot_token:
        print(
            "TELEGRAM_BOT_TOKEN is not configured.",
            file=sys.stderr,
        )
        return

    if not chat_id:
        print(
            "TELEGRAM_CHAT_ID is not configured.",
            file=sys.stderr,
        )
        return

    url = (
        "https://api.telegram.org/bot"
        f"{bot_token}/sendMessage"
    )

    # Telegram messages are limited to
    # approximately 4096 characters.
    max_length = 3900

    chunks = [
        message[index:index + max_length]
        for index in range(
            0,
            len(message),
            max_length,
        )
    ]

    print(
        f"Sending {len(chunks)} "
        "Telegram message(s)..."
    )

    for index, chunk in enumerate(
        chunks,
        start=1,
    ):

        payload = json.dumps(
            {
                "chat_id": chat_id,
                "text": chunk,
            }
        ).encode("utf-8")

        request = Request(
            url,
            data=payload,
            headers={
                "Content-Type": (
                    "application/json"
                )
            },
            method="POST",
        )

        with urlopen(
            request,
            timeout=30,
        ) as response:

            response.read()

        print(
            f"Telegram message "
            f"{index}/{len(chunks)} sent."
        )


def write_failure(error):
    with open(
        OUTPUT_FILE,
        "w",
        encoding="utf-8",
    ) as file:

        file.write(
            "# Embedded Systems "
            "Job Search — FAILED\n\n"
        )

        file.write(
            "The GitHub-only job "
            "search failed.\n\n"
        )

        file.write(
            "## Error\n\n"
        )

        file.write(
            f"{error}\n\n"
        )

        file.write(
            "## Traceback\n\n"
        )

        file.write(
            "```text\n"
        )

        file.write(
            traceback.format_exc()
        )

        file.write(
            "\n```\n"
        )


def main():
    try:

        print(
            "Starting GitHub-only "
            "Embedded Systems "
            "job search..."
        )

        raw_results = search_all()

        results = prepare_results(
            raw_results
        )

        report = create_report(
            results
        )

        with open(
            OUTPUT_FILE,
            "w",
            encoding="utf-8",
        ) as file:

            file.write(report)

        # Send the completed report
        # to Telegram.
        send_telegram_message(
            report
        )

        print("")

        print("=" * 80)

        print(
            "Job search completed "
            "successfully."
        )

        print(
            f"Results: {len(results)}"
        )

        print(
            f"Output: {OUTPUT_FILE}"
        )

        print("=" * 80)

        return 0

    except Exception as exc:

        print(
            f"Job search failed: {exc}",
            file=sys.stderr,
        )

        write_failure(
            str(exc)
        )

        return 1


if __name__ == "__main__":
    sys.exit(main())

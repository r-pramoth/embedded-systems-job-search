        f"search queries..."
    )

    all_results = []

    for index, query in enumerate(
        SEARCH_QUERIES,
        start=1,
    ):

        print(
            f"[{index}/"
            f"{len(SEARCH_QUERIES)}] "
            f"{query}"
        )

        results = google_news_search(
            query
        )

        all_results.extend(results)

        time.sleep(0.3)

    print(
        f"Raw results: "
        f"{len(all_results)}"
    )

    return all_results


def prepare_results(results):
    prepared = []

    for result in results:

        if not result.get("url"):
            continue

        result["published_datetime"] = (
            parse_date(
                result.get(
                    "published",
                    "",
                )
            )
        )

        result["company"] = (
            extract_company(
                result["title"],
                result["description"],
                result["source"],
            )
        )

        prepared.append(result)

    prepared = deduplicate(
        prepared
    )

    print(
        f"Unique results: "
        f"{len(prepared)}"
    )

    enriched = []

    for index, result in enumerate(
        prepared,
        start=1,
    ):

        print(
            f"Checking result "
            f"{index}/"
            f"{len(prepared)}: "
            f"{result['title'][:80]}"
        )

        try:

            result = enrich_result(
                result
            )

            if not result[
                "embedded_relevant"
            ]:
                continue

            if result["senior"]:
                continue

            enriched.append(result)

        except Exception as exc:

            print(
                f"Enrichment failed: "
                f"{exc}",
                file=sys.stderr,
            )

    enriched.sort(
        key=lambda item: item["score"],
        reverse=True,
    )

    return enriched


def company_reputation(company):
    if company in PRIORITY_COMPANIES:
        return (
            "Major / established company; "
            "priority company in this search"
        )

    return (
        "Company reputation requires "
        "individual verification"
    )


def career_value(result):
    matches = result[
        "technical_matches"
    ]

    if len(matches) >= 6:
        return "Very strong"

    if len(matches) >= 3:
        return "Strong"

    if len(matches) >= 1:
        return "Moderate"

    return "Unclear"


def salary_classification(salary):
    if salary == "Not disclosed":
        return "Salary not mentioned"

    lowered = salary.lower()

    if (
        "12" in lowered
        or "13" in lowered
    ):
        return (
            "Potentially meets preferred "
            "₹1 lakh/month target; "
            "verify CTC/base"
        )

    return (
        "Below or unclear relative to "
        "₹1 lakh/month preference"
    )


def job_markdown(
    result,
    number,
):
    published = result.get(
        "published_datetime"
    )

    if published:

        posted = published.strftime(
            "%Y-%m-%d %H:%M IST"
        )

    else:
        posted = "Not available"

    location = result["location"]

    if "India" in location:
        region = "India"
    else:
        region = "International / unclear"

    technical = ", ".join(
        result[
            "technical_matches"
        ][:15]
    )

    if not technical:
        technical = "Not identified"

    description = result[
        "description"
    ]

    if not description:

        description = (
            "Job description could not "
            "be fully extracted from "
            "the source."
        )

    return f"""
### {number}. {result["title"]}

**Company:** {result["company"]}

**Company size/reputation:** \
{company_reputation(result["company"])}

**Location:** {location}

**Region:** {region}

**Experience requirement:** \
{result["experience"]}

**Fresher relevance:** \
{"Potentially suitable" if result["fresher_relevant"] else "Eligibility unclear"}

**Posted:** {posted}

**Freshness:** {result["freshness"]}

**Salary:** {result["salary"]}

**Salary vs ₹1 lakh/month preference:** \
{salary_classification(result["salary"])}

**Embedded Systems relevance:** \
{"Yes" if result["embedded_relevant"] else "Unclear"}

**Career value for Embedded Systems:** \
{career_value(result)}

**Key technologies:** {technical}

**Source:** {result["source"]}

**APPLY HERE:** {result["url"]}

**Why this may be relevant:**

The listing contains Embedded Systems/
Firmware-related keywords and may be
relevant to an entry-level candidate.

Verify the complete job description
and eligibility before applying.

**Job description/source summary:**

{description[:1500]}
"""


def priority_company_report(results):
    found = {}

    for result in results:

        company = result[
            "company"
        ]

        if company in PRIORITY_COMPANIES:

            found[company] = (
                found.get(
                    company,
                    0,
                )
                + 1
            )

    lines = []

    for company in PRIORITY_COMPANIES:

        count = found.get(
            company,
            0,
        )

        if count:

            lines.append(
                f"- **{company}** — "
                f"{count} potentially "
                f"relevant result(s) found"
            )

        else:

            lines.append(
                f"- **{company}** — "
                "No suitable result discovered"
            )

    return "\n".join(lines)



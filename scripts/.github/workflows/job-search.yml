def clean_text(value):
    value = html.unescape(value or "")
    value = re.sub(
        r"<[^>]+>",
        " ",
        value,
    )
    value = re.sub(
        r"\s+",
        " ",
        value,
    )

    return value.strip()


def fetch_url(url, timeout=20):
    request = Request(
        url,
        headers={
            "User-Agent": (
                "Mozilla/5.0 "
                "(compatible; EmbeddedJobSearch/1.0; "
                "+https://github.com/)"
            )
        },
    )

    with urlopen(
        request,
        timeout=timeout,
    ) as response:

        content_type = response.headers.get(
            "Content-Type",
            "",
        )

        data = response.read()

        charset = "utf-8"

        match = re.search(
            r"charset=([A-Za-z0-9._-]+)",
            content_type,
            re.IGNORECASE,
        )

        if match:
            charset = match.group(1)

        return data.decode(
            charset,
            errors="replace",
        )


def google_news_search(query):
    encoded_query = quote(query)

    url = (
        "https://news.google.com/rss/search?"
        f"q={encoded_query}"
        "&hl=en-IN"
        "&gl=IN"
        "&ceid=IN:en"
    )

    try:
        xml_data = fetch_url(url)

        root = ElementTree.fromstring(
            xml_data
        )

        results = []

        for item in root.findall(".//item"):
            title = (
                item.findtext("title")
                or ""
            )

            link = (
                item.findtext("link")
                or ""
            )

            description = (
                item.findtext("description")
                or ""
            )

            pub_date = (
                item.findtext("pubDate")
                or ""
            )

            source = (
                item.findtext("source")
                or ""
            )

            results.append(
                {
                    "title": clean_text(title),
                    "url": link.strip(),
                    "description": clean_text(
                        description
                    ),
                    "published": pub_date,
                    "source": clean_text(source),
                    "query": query,
                }
            )

        return results

    except Exception as exc:
        print(
            f"Search failed for query "
            f"'{query}': {exc}",
            file=sys.stderr,
        )

        return []


def parse_date(date_string):
    if not date_string:
        return None

    try:
        return parsedate_to_datetime(
            date_string
        ).astimezone(IST)

    except Exception:
        return None


def freshness_label(published):
    if not published:
        return "Posting date not available"

    now = datetime.now(IST)

    age = now - published

    if age <= timedelta(hours=24):
        return "Posted within 24 hours"

    if age <= timedelta(days=3):
        return "Posted within 3 days"

    if age <= timedelta(days=7):
        return "Posted within 7 days"

    return "Older than 7 days"


def extract_company(
    title,
    description,
    source,
):
    text = (
        f"{title} "
        f"{description} "
        f"{source}"
    )

    lowered = text.lower()

    for company in PRIORITY_COMPANIES:
        if company.lower() in lowered:
            return company

    if source:
        return source

    return "Company not identified"


def extract_location(text):
    lowered = text.lower()

    for location in INDIA_LOCATIONS:

        if location in lowered:

            if location in (
                "bangalore",
                "bengaluru",
            ):
                return "Bengaluru, India"

            return (
                location.title()
                + ", India"
            )

    international_locations = [
        "germany",
        "united states",
        "usa",
        "canada",
        "uk",
        "united kingdom",
        "ireland",
        "netherlands",
        "france",
        "sweden",
        "singapore",
        "japan",
        "australia",
    ]

    for location in international_locations:

        if location in lowered:
            return location.title()

    return "Location not verified"


def extract_salary(text):
    patterns = [
        r"₹\s?[\d,]+\s?(?:lpa|lakh|lakhs)",
        r"₹\s?[\d,]+\s?(?:per month|/month)",
        r"\b\d+(?:\.\d+)?\s?LPA\b",
        r"\b\d+(?:\.\d+)?\s?lakhs?\b",
        r"\$\s?[\d,]+",
    ]

    for pattern in patterns:

        match = re.search(
            pattern,
            text,
            re.IGNORECASE,
        )

        if match:
            return match.group(0)

    return "Not disclosed"


def find_experience(text):
    patterns = [
        r"\b0\s*[-–]\s*1\s*years?\b",
        r"\b0\s*[-–]\s*2\s*years?\b",
        r"\b0\s*[-–]\s*3\s*years?\b",
        r"\b0\s*[-–]\s*4\s*years?\b",
        r"\b1\s*[-–]\s*2\s*years?\b",
        r"\b1\s*[-–]\s*3\s*years?\b",
        r"\b\d+\+?\s*years?\b",
        r"\bfreshers?\b",
        r"\bentry[- ]level\b",
        r"\bgraduate\b",
        r"\btrainee\b",
    ]

    for pattern in patterns:

        match = re.search(
            pattern,
            text,
            re.IGNORECASE,
        )

        if match:
            return match.group(0)

    return "Not mentioned"


def technical_matches(text):
    lowered = text.lower()

    matches = []

    for keyword in EMBEDDED_KEYWORDS:

        if keyword in lowered:
            matches.append(keyword)

    return list(
        dict.fromkeys(matches)
    )


def is_embedded_related(text):
    lowered = text.lower()

    return any(
        keyword in lowered
        for keyword in EMBEDDED_KEYWORDS
    )


def is_fresher_relevant(text):
    lowered = text.lower()

    return any(
        keyword in lowered
        for keyword in FRESHER_KEYWORDS
    )


def is_clearly_senior(text):
    lowered = text.lower()

    for keyword in SENIOR_KEYWORDS:

        if keyword in lowered:
            return True

    experience_matches = re.findall(
        r"\b([2-9]|1[0-9])\+?\s*years?\b",
        lowered,
    )

    if experience_matches:

        for value in experience_matches:

            if int(value) >= 2:
                return True

    return False


def company_quality(company):
    if company in PRIORITY_COMPANIES:
        return 25

    return 0


def score_result(result):
    title = result["title"]
    description = result["description"]

    text = (
        f"{title} {description}"
    ).lower()

    score = 0

    embedded = technical_matches(
        text
    )

    score += min(
        len(embedded) * 3,
        30,
    )

    if is_fresher_relevant(text):
        score += 25

    if (
        "bengaluru" in text
        or "bangalore" in text
    ):
        score += 15

    score += company_quality(
        result["company"]
    )

    if "firmware" in text:
        score += 5

    if "embedded c" in text:
        score += 5

    if "rtos" in text:
        score += 5

    if "embedded linux" in text:
        score += 5

    if "graduate engineer trainee" in text:
        score += 10

    if "internship" in text:
        score += 5

    if is_clearly_senior(text):
        score -= 40

    published = result.get(
        "published_datetime"
    )

    if published:

        age = (
            datetime.now(IST)
            - published
        )

        if age <= timedelta(hours=24):
            score += 20

        elif age <= timedelta(days=3):
            score += 10

        elif age <= timedelta(days=7):
            score += 5

    return score


def normalize_url(url):
    if not url:
        return ""

    parsed = urlparse(url)

    return (
        parsed.scheme.lower(),
        parsed.netloc.lower(),
        parsed.path.rstrip("/"),
    )


def deduplicate(results):
    unique = {}

    for result in results:

        key = normalize_url(
            result["url"]
        )

        if not key:
            key = (
                result["title"].lower(),
                result["company"].lower(),
            )

        if key not in unique:
            unique[key] = result

    return list(
        unique.values()
    )


def enrich_result(result):
    url = result["url"]

    page_text = ""

    try:
        page_text = clean_text(
            fetch_url(url)
        )

        page_text = page_text[:30000]

    except Exception as exc:
        print(
            f"Could not fetch {url}: {exc}",
            file=sys.stderr,
        )

    combined = (
        result["title"]
        + " "
        + result["description"]
        + " "
        + page_text
    )

    result["page_text"] = page_text

    result["location"] = extract_location(
        combined
    )

    result["salary"] = extract_salary(
        combined
    )

    result["experience"] = find_experience(
        combined
    )

    result["technical_matches"] = (
        technical_matches(combined)
    )

    result["embedded_relevant"] = (
        is_embedded_related(combined)
    )

    result["fresher_relevant"] = (
        is_fresher_relevant(combined)
    )

    result["senior"] = (
        is_clearly_senior(combined)
    )

    result["freshness"] = freshness_label(
        result["published_datetime"]
    )

    result["score"] = score_result(
        result
    )

    return result


